<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CoughSure – TB Screening{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .risk-Low{background:#d1e7dd;color:#0f5132;border-color:#a3cfbb}
    .risk-Medium{background:#fff3cd;color:#664d03;border-color:#ffe69c}
    .risk-High{background:#f8d7da;color:#842029;border-color:#f1aeb5}
    .aqi-Good,.aqi-Satisfactory{background:#198754}.aqi-Moderate{background:#ca8a04}
    .aqi-Poor{background:#ea580c}.aqi-Very.Poor,.aqi-VeryPoor{background:#b91c1c}.aqi-Severe{background:#7f1d1d}
  </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container"><a class="navbar-brand" href="/">CoughSure</a>
    <span class="navbar-text small">AI respiratory screening · Delhi</span></div>
</nav>
<main class="container" style="max-width:820px">
  {% block content %}{% endblock %}
  <div class="alert alert-secondary small mt-4">
    <strong>Disclaimer:</strong> This is <em>not</em> a medical diagnosis, only an AI-powered screening tool.
    See a doctor for confirmation. The current model was trained on the Coswara COVID-19 dataset and has
    not been validated for tuberculosis.
  </div>
</main>
</body>
</html>
